name: Pytest

on:
    push:
        branches: [master]
    pull_request:

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/setup-python@v2
              with:
                  python-version: 3.8
            - uses: actions/checkout@v2
              with:
                  submodules: "recursive"
            - run: pip3 install -r requirements.txt
            - name: build
              run: mkdocs build --strict
            - name: deploy
              if: github.event_name == 'push'
              run: |
                  mkdocs gh-deploy --force
